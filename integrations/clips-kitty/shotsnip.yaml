model: qwen3:8b
channel: '@shotsnipclips'
content_language: auto
auto_upload: false
privacy: public
channels: []
poll_interval_minutes: 15
llm:
  translation_model: ''
  temperature: 0.4
  num_ctx: 8192
  ollama_host: http://localhost:11434
whisper:
  model: small
  device: cpu
transcription:
  backend: local
  model: ''
clips:
  min_score: 55
  max_clips_per_video: 1
  min_duration: 30
  max_duration: 30
  vertical: false
  captions: false
  outro: false
scoring:
  weights:
    text: 0.3
    visual: 0.2
    reaction: 0.2
    audio: 0.2
    engagement: 0.1
  signal_peak_percentile: 85
  creator_context_max: 6
  action_bonus: 10
  audience_bonus: 8
  rerank_pool: 8
  reaction_top_k: 8
analysis:
  max_overlap: 0.4
  max_text_similarity: 0.7
  max_segment_reuse: 0.4
  chunk_seconds: 300
  chunk_overlap_seconds: 45
  long_video_threshold_seconds: 420
video:
  encoder: auto
  parallel_renders: 3
tracking:
  detector: yolov8n-pose.pt
  sample_fps: 8
upload:
  daily_limit: 6
  client_secret: config/client_secret.json
feedback:
  relay_url: ''
paths:
  data_dir: D:/Clips-Kitty/data
