name: daily-short
concurrency:
  group: daily-short
  cancel-in-progress: false

on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC = 11:00 PM IST daily
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: [self-hosted, macOS, yt-shorts]
    steps:
      - uses: actions/checkout@v4
      - name: Create local Python environment
        run: |
          python3 --version
          python3 -m venv .venv
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.0
      - name: Verify Mac runner dependencies
        run: |
          export PATH="/opt/homebrew/opt/ffmpeg-full/bin:$PATH"
          echo "/opt/homebrew/opt/ffmpeg-full/bin" >> "$GITHUB_PATH"
          command -v ffmpeg
          ffmpeg -hide_banner -filters 2>&1 | grep -q drawtext
      - run: .venv/bin/python -m pip install -r requirements.txt
      - name: Export local Brave cookies
        run: .venv/bin/python export_cookies.py
      - name: Run pipeline
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            .venv/bin/python pipeline.py --dry-run
          else
            .venv/bin/python pipeline.py
          fi
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FFMPEG_FONT: Arial
          USE_RENDERED_HEATMAP: "1"
          BRAVE_EXECUTABLE: /Applications/Brave Browser.app/Contents/MacOS/Brave Browser
      - name: Remove exported cookies
        if: always()
        run: rm -f cookies.txt
      - name: Commit state
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_videos.json log.jsonl
          git diff --cached --quiet || git commit -m "state: daily run"
          git push
